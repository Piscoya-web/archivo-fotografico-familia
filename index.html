<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivo Fotográfico Piscoya Rivera</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #f4f4f2; 
      --text-main: #111111;
      --text-muted: #666666;
    }
    body {
      margin: 0; padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    #auth-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-color);
      display: flex; justify-content: center; align-items: center;
      z-index: 9999;
      padding: 20px;
      box-sizing: border-box;
    }
    .modal-content {
      max-width: 400px; width: 100%; text-align: center;
      background: #ffffff; padding: 35px 30px;
      border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      box-sizing: border-box;
    }
    .modal-content h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem; line-height: 1.15; margin: 0 0 6px 0;
    }
    .modal-content p.subtitle {
      font-size: 0.9rem; color: var(--text-muted); margin: 0 0 15px 0;
    }
    .trust-note {
      font-size: 0.8rem;
      line-height: 1.45;
      color: #555555;
      background: #f8f8f6;
      border-left: 3px solid var(--text-main);
      padding: 10px 12px;
      margin-bottom: 20px;
      text-align: left;
      border-radius: 0 4px 4px 0;
    }
    
    .tabs {
      display: flex; border-bottom: 1px solid #e0e0e0; margin-bottom: 18px;
    }
    .tab-btn {
      flex: 1; padding: 10px; background: none; border: none;
      font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 500;
      color: var(--text-muted); cursor: pointer;
      border-bottom: 2px solid transparent; transition: all 0.2s;
    }
    .tab-btn.active {
      color: var(--text-main); border-bottom: 2px solid var(--text-main); font-weight: 600;
    }

    .modal-content input {
      width: 100%; padding: 12px; margin-bottom: 10px;
      border: 1px solid #ddd; background: #fafafa; color: #111;
      border-radius: 4px; font-family: 'Inter', sans-serif;
      box-sizing: border-box; text-align: center; font-size: 0.9rem;
    }
    .modal-content input:focus {
      outline: none; border-color: #111; background: #fff;
    }
    .submit-btn {
      width: 100%; padding: 14px; margin-top: 6px;
      background: var(--text-main); color: #fff;
      border: none; cursor: pointer; font-size: 0.85rem;
      letter-spacing: 1px; text-transform: uppercase;
      border-radius: 4px; transition: background 0.3s;
    }
    .submit-btn:hover { background: #333; }
    
    .status-msg { 
      font-size: 0.85rem; display: none; margin-top: 15px; font-weight: 500;
    }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 40px 5%;
    }
    .logo {
      font-family: 'Inter', sans-serif;
      font-weight: 600; font-size: 1.2rem; letter-spacing: -0.5px;
    }
    .user-bar {
      display: flex; align-items: center; gap: 15px;
    }
    .user-info {
      font-size: 0.8rem; color: var(--text-muted);
    }
    .logout-btn {
      background: transparent; border: 1px solid #ccc; color: var(--text-main);
      padding: 5px 10px; font-size: 0.75rem; border-radius: 4px; cursor: pointer;
    }
    .logout-btn:hover { background: #e6e6e6; }

    .hero-title {
      padding: 0 5%;
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 7vw, 5.5rem); 
      line-height: 1.05; margin: 20px 0 60px 0;
      letter-spacing: -2px;
    }

    .gallery-container {
      padding: 0 5% 100px;
      display: none; 
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 40px 20px;
    }
    .album-card {
      text-decoration: none; color: inherit;
      display: block; cursor: pointer;
    }
    .album-card:nth-child(3n+1) { grid-column: span 8; } 
    .album-card:nth-child(3n+2) { grid-column: span 4; } 
    .album-card:nth-child(3n+3) { grid-column: span 6; } 
    .album-image-wrapper {
      width: 100%; aspect-ratio: 4/3;
      overflow: hidden; background: #eaeaea;
    }
    .album-image-wrapper img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .album-card:hover img { transform: scale(1.05); }
    .album-meta { margin-top: 15px; display: flex; gap: 15px; }
    .album-number {
      font-size: 2.5rem; font-family: 'Inter', sans-serif;
      font-weight: 300; line-height: 0.8; letter-spacing: -1px;
    }
    .album-details h3 { margin: 0; font-size: 0.9rem; font-weight: 600; }
    .album-details p { margin: 2px 0 0; font-size: 0.75rem; color: var(--text-muted); }

    @media (max-width: 768px) {
      .grid { display: flex; flex-direction: column; gap: 50px; }
      .album-card { width: 100%; }
      header { padding: 20px 5%; }
    }
  </style>
</head>
<body>

  <div id="auth-modal">
    <div class="modal-content">
      <h1>Familia Piscoya Rivera.</h1>
      <p class="subtitle">Archivo Fotográfico Familiar</p>

      <div class="trust-note">
        Este espacio es exclusivo para nuestra familia. Te pedimos estos datos únicamente para saber quiénes nos visitan, compartir nuevos recuerdos y mantenernos en contacto.
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tab-registro" onclick="cambiarModo('registro')">Nuevo Registro</button>
        <button class="tab-btn" id="tab-login" onclick="cambiarModo('login')">Ya tengo cuenta</button>
      </div>
      
      <!-- Campos exclusivos de Registro -->
      <div id="campos-registro">
        <input type="text" id="user-name" placeholder="Nombre completo">
        <input type="text" id="user-rel" placeholder="Parentesco (Ej: Primo, Tío, Sobrina)">
        <input type="tel" id="user-phone" placeholder="Teléfono / WhatsApp">
      </div>

      <!-- Campos compartidos (Correo + Año de nacimiento como contraseña) -->
      <input type="email" id="user-email" placeholder="Correo electrónico" required>
      <input type="number" id="birth-year" placeholder="Año de nacimiento (Contraseña, ej: 1965)" required>
      
      <button class="submit-btn" id="btn-accion" onclick="procesarAcceso()">Registrarme e Ingresar</button>
      
      <p id="status-msg" class="status-msg"></p>
    </div>
  </div>

  <header>
    <div class="logo">Familia Piscoya Rivera.</div>
    <div class="user-bar">
      <div class="user-info" id="user-display"></div>
      <button class="logout-btn" id="logout-btn" style="display:none;" onclick="cerrarSesion()">Salir</button>
    </div>
  </header>

  <h1 class="hero-title">Archivo Fotográfico<br>Familiar</h1>

  <main class="gallery-container" id="galeria-container">
    <div class="grid" id="grid-albumes"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
  
  <script>
    const SUPABASE_URL = 'https://mqpgvxrqnulskmepmuri.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xcGd2eHJxbnVsc2ttZXBtdXJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNTkzNjQsImV4cCI6MjA5ODgzNTM2NH0.z2b41M54eZx7Xx4OONDfY9xjfuwSm6ov8TmKFUrLCPk';
    
    const clienteSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: false }
    });

    let modoActual = 'registro';

    function cambiarModo(modo) {
      modoActual = modo;
      const camposRegistro = document.getElementById('campos-registro');
      const tabRegistro = document.getElementById('tab-registro');
      const tabLogin = document.getElementById('tab-login');
      const btnAccion = document.getElementById('btn-accion');
      const statusMsg = document.getElementById('status-msg');
      statusMsg.style.display = 'none';

      if (modo === 'login') {
        camposRegistro.style.display = 'none';
        tabLogin.classList.add('active');
        tabRegistro.classList.remove('active');
        btnAccion.innerText = 'Ingresar al archivo';
      } else {
        camposRegistro.style.display = 'block';
        tabRegistro.classList.add('active');
        tabLogin.classList.remove('active');
        btnAccion.innerText = 'Registrarme e Ingresar';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      Fancybox.bind('[data-fancybox]', {
        Carousel: { transition: "fade" },
        Images: { zoom: false },
        Toolbar: { display: { left: ["infobar"], middle: [], right: ["close"] } }
      });

      const usuarioActivo = localStorage.getItem('usuario_activo');
      if (usuarioActivo) {
        desbloquearWeb(usuarioActivo);
      }
    });

    async function procesarAcceso() {
      const statusMsg = document.getElementById('status-msg');
      statusMsg.style.display = 'block';
      statusMsg.style.color = '#0066cc';
      statusMsg.innerText = "Verificando...";

      const nombre = document.getElementById('user-name').value.trim();
      const parentesco = document.getElementById('user-rel').value.trim();
      const telefono = document.getElementById('user-phone').value.trim();
      const email = document.getElementById('user-email').value.trim().toLowerCase();
      const anio = document.getElementById('birth-year').value.trim();

      if (!email || !anio) {
        statusMsg.style.color = '#d93025';
        statusMsg.innerText = "Ingresa tu correo y año de nacimiento.";
        return;
      }

      if (modoActual === 'registro' && (!nombre || !parentesco || !telefono)) {
        statusMsg.style.color = '#d93025';
        statusMsg.innerText = "Por favor, completa todos tus datos de registro.";
        return;
      }

      try {
        const { data: usuarios, error: searchError } = await clienteSupabase
          .from('formulario_familia')
          .select('*')
          .eq('correo', email);

        if (searchError) throw searchError;

        let usuarioValido = null;

        if (usuarios && usuarios.length > 0) {
          const usuarioExistente = usuarios[0];
          if (String(usuarioExistente.anio_nacimiento) === String(anio)) {
            usuarioValido = usuarioExistente;
            statusMsg.style.color = '#0f9d58';
            statusMsg.innerText = "¡Bienvenido/a de nuevo, " + usuarioValido.nombre_completo + "!";
          } else {
            statusMsg.style.color = '#d93025';
            statusMsg.innerText = "Año de nacimiento incorrecto para este correo.";
            return;
          }
        } else {
          if (modoActual === 'login') {
            statusMsg.style.color = '#d93025';
            statusMsg.innerText = "Correo no registrado. Usa la pestaña 'Nuevo Registro'.";
            return;
          }

          const { data: nuevoUsuario, error: insertError } = await clienteSupabase
            .from('formulario_familia')
            .insert([
              { 
                nombre_completo: nombre, 
                correo: email, 
                parentesco: parentesco, 
                telefono: telefono,
                anio_nacimiento: parseInt(anio) 
              }
            ])
            .select();

          if (insertError) throw insertError;
          
          usuarioValido = nuevoUsuario[0];
          statusMsg.style.color = '#0f9d58';
          statusMsg.innerText = "¡Registro exitoso! Bienvenido/a, " + usuarioValido.nombre_completo;
        }

        if (usuarioValido) {
          localStorage.setItem('usuario_activo', usuarioValido.nombre_completo);
          localStorage.setItem('usuario_correo', usuarioValido.correo);
          
          setTimeout(() => {
            desbloquearWeb(usuarioValido.nombre_completo);
          }, 1000);
        }

      } catch (err) {
        statusMsg.style.color = '#d93025';
        statusMsg.innerText = "Error al conectar: " + err.message;
        console.error("Detalle del error:", err);
      }
    }

    function desbloquearWeb(nombreUsuario) {
      document.getElementById('auth-modal').style.display = 'none';
      document.getElementById('galeria-container').style.display = 'block';
      document.getElementById('user-display').innerText = `Visualizando como: ${nombreUsuario}`;
      document.getElementById('logout-btn').style.display = 'inline-block';
      cargarAlbumes();
    }

    function cerrarSesion() {
      localStorage.removeItem('usuario_activo');
      localStorage.removeItem('usuario_correo');
      location.reload();
    }

    async function cargarAlbumes() {
      const { data: albums, error: albumsError } = await clienteSupabase
        .from('albums')
        .select('*')
        .order('id', { ascending: true });
        
      if (albumsError) return;

      let photos = [];
      let from = 0;
      let to = 999;
      let hayMasFotos = true;

      while (hayMasFotos) {
        const { data: batch, error: photosError } = await clienteSupabase
          .from('photos')
          .select('*')
          .range(from, to);

        if (photosError) break;

        photos = photos.concat(batch);

        if (batch.length < 1000) {
          hayMasFotos = false;
        } else {
          from += 1000;
          to += 1000;
        }
      }

      const contenedor = document.getElementById('grid-albumes');
      contenedor.innerHTML = '';

      albums.forEach((album, index) => {
        const numeroFormateado = String(index + 1).padStart(2, '0') + ".";

        const divAlbum = document.createElement('div');
        divAlbum.style.display = 'contents'; 

        const card = document.createElement('a');
        card.className = 'album-card';
        card.href = album.cover_url; 
        card.setAttribute('data-fancybox', `gallery-${album.id}`); 
        card.setAttribute('data-caption', album.title);

        card.innerHTML = `
          <div class="album-image-wrapper">
            <img src="${album.cover_url}" alt="${album.title}" loading="lazy">
          </div>
          <div class="album-meta">
            <div class="album-number">${numeroFormateado}</div>
            <div class="album-details">
              <h3>${album.title}</h3>
              <p>${album.photo_count || 0} fotografías</p>
            </div>
          </div>
        `;
        divAlbum.appendChild(card);

        if (photos) {
          const fotosDelAlbum = photos.filter(p => String(p.album_id) === String(album.id));
          
          fotosDelAlbum.forEach(foto => {
            const hiddenLink = document.createElement('a');
            hiddenLink.href = foto.url; 
            hiddenLink.setAttribute('data-fancybox', `gallery-${album.id}`); 
            hiddenLink.setAttribute('data-caption', foto.caption || ''); 
            hiddenLink.style.display = 'none'; 
            divAlbum.appendChild(hiddenLink);
          });
        }

        contenedor.appendChild(divAlbum);
      });
    }
  </script>
</body>
</html>
